name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python source
        run: python -m compileall -q scripts tests
      - name: Validate sample configurations
        run: |
          python scripts/validate_config.py configs/default_character.json
          python scripts/validate_config.py examples/dark_suit_purple_eyes.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
